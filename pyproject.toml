[project]
name = "football-intelligence"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhishek", email = "nilkanthabhishek007@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.12",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "reportlab>=5.0.1",
    "sentence-transformers>=6.1.0",
    "tavily-python>=0.8.4",
    "trafilatura>=2.2.0",
]

[project.scripts]
football-intelligence = "football_intelligence:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
